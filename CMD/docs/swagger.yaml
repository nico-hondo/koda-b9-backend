basePath: /
definitions:
  github_com_nico-hondo_internal_dto.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  github_com_nico-hondo_internal_dto.ChangeProfileUser:
    properties:
      avatar:
        type: string
      bio:
        type: string
      job:
        type: string
      loc:
        type: string
      nama:
        type: string
      workplace:
        type: string
    type: object
  github_com_nico-hondo_internal_dto.ErrorResponse:
    properties:
      data: {}
      msg:
        type: string
      success:
        type: boolean
    type: object
  github_com_nico-hondo_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_nico-hondo_internal_dto.NewTestimoni:
    properties:
      comment:
        type: string
      user_id:
        type: integer
    type: object
  github_com_nico-hondo_internal_dto.RegisterRequest:
    properties:
      email:
        type: string
      nama:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - nama
    - password
    type: object
  github_com_nico-hondo_internal_dto.Response:
    properties:
      data: {}
      msg:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8000
info:
  contact: {}
  description: Completed Eventhub backend during Koda Bootcamp
  title: Koda B9 Backend
  version: "1.0"
paths:
  /auth:
    post:
      consumes:
      - application/json
      description: Login Acc from body
      parameters:
      - description: body to login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_nico-hondo_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nico-hondo_internal_dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_nico-hondo_internal_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_nico-hondo_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_nico-hondo_internal_dto.ErrorResponse'
      summary: Login an Account
      tags:
      - Auth
  /auth/change-password:
    patch:
      consumes:
      - application/json
      description: Change password for logged-in user
      parameters:
      - description: Data Password Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_nico-hondo_internal_dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nico-hondo_internal_dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_nico-hondo_internal_dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_nico-hondo_internal_dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_nico-hondo_internal_dto.Response'
      security:
      - BearerToken: []
      summary: Change Password User
      tags:
      - Auth
  /auth/change-profile:
    patch:
      consumes:
