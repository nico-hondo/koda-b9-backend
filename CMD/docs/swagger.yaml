            $ref: '#/definitions/github_com_nico-hondo_internal_dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_nico-hondo_internal_dto.Response'
      security:
      - BearerToken: []
      summary: Change Profile User
      tags:
      - Auth
  /auth/register:
